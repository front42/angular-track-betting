<img class="sweet-home" src="assets/sweet-home.png" alt="Sweet Home" />

@if (phase() === 'ready') {
  <div class="clickjacker" (click)="showRacerCard()"></div>
}
<svg
  class="kolobok"
  [class.returning]="phase() === 'returning'"
  [style.left]="styleLeft()"
  [style.--rotation-angle.deg]="rotationAngle()"
  [style.--race-duration]="duration()"
  [style.--race-timing-fn]="timingFn()"
  [style.--kolobok-color]="fill()"
  viewBox="0 0 70 70"
>
  <use href="assets/kolobok.svg#racer"></use>
</svg>

<img class="fir-tree" src="assets/fir-tree.png" alt="Fir-Tree" />

<img
  class="fox-tail"
  [class.wag-hi]="isRacerFinished()"
  [class.wag-bye]="phase() === 'returning'"
  src="assets/fox-tail.png"
  alt="Fox Tail"
/>
